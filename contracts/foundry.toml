[profile.default]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read", path = "../vectors" }]
test = "test"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 10000
evm_version = "cancun"
via_ir = true
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
base = "https://mainnet.base.org"
